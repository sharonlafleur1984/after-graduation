# Runs on every pull request: checks types, runs the tests, and makes sure the app and Storybook still build.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Let npm fetch the private design system (lantern-code)
        run: git config --global url."https://x-access-token:${LANTERN_CODE_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          LANTERN_CODE_TOKEN: ${{ secrets.LANTERN_CODE_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
